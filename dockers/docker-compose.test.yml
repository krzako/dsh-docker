# Test instance of the full DSH deployment (DeepSeek Harness + dsh-git
# bridge), fully isolated from the production stack:
#
#   name: dsh-test                 separate compose project, so a
#                                  `docker compose down -v` here can never
#                                  touch the production volumes
#   container names                dsh-test / dsh-git-test
#   host ports                     4080 (web), 4310-4330 (agents),
#                                  10418 (git daemon) -- production ports
#                                  plus 1000, so both instances can run at
#                                  the same time
#   data volumes (all -test)       ../volumes/workspaces-test      (bind)
#                                  ../volumes/dsh-git-repos-test   (bind)
#                                  dsh-home-test                  (named)
#
# The settings seed file is shared with the production instance (read-only).
# Provider API keys come from the same .env file.
#
# Start it with tools/run_test_instance.sh or:
#   docker compose -f docker-compose.test.yml up

name: dsh-test

services:
  deepseek-harness:
    build:
      context: .
      additional_contexts:
        dsh_source: "${DSH_SOURCE:-../deepseek-harness}"
        dsh_docker_git_source: "${DSH_DOCKER_GIT_SOURCE:-../.git/modules/deepseek-harness}"

    image: ${DSH_TEST_IMAGE:-deepseek-harness:test}
    container_name: dsh-test

    environment:
      DSH_PUBLIC_WEB_URL: "http://localhost:4080"
      # Provider API keys, sourced from the host .env file (same names as
      # the production instance).
      LLM_PROXY_API_KEY: "${LLM_PROXY_API_KEY:-}"
      COPILOT_PROXY_API_KEY: "${COPILOT_PROXY_API_KEY:-}"

    ports:
      # deepseek-harness web port (production 3080 + 1000)
      - "127.0.0.1:4080:3080"
      # Ports for agents applications (production 3310-3330 + 1000)
      - "127.0.0.1:4310-4330:3310-3330"

    volumes:
      - "../volumes/workspaces-test:/home/node"
      - "dsh-home-test:/home/node/.dsh"
      # Settings seed for the startup merge; mounted read-only so host edits
      # apply without rebuilding the image.
      - "./settings.seed.test.yaml:/opt/dsh-seed/settings.seed.yaml:ro"

    stdin_open: true
    tty: true

  dsh-git:
    # Same service name as in production so the host name `dsh-git` resolves
    # inside the isolated network (agents push to git://dsh-git/...).
    build:
      context: ./dsh-git/server
    image: ${BRIDGE_TEST_IMAGE:-dsh-git:test}
    container_name: dsh-git-test
    user: "${BRIDGE_UID:-1000}:${BRIDGE_GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - type: bind
        source: ../volumes/dsh-git-repos-test
        target: /repos
    ports:
      # git daemon (production 9418 + 1000)
      - "127.0.0.1:10418:9418"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-test
    restart: unless-stopped
    ports:
      - "127.0.0.1:10999:8080"
    environment:
      WEBUI_URL: "http://localhost:10999"
      WEBUI_AUTH: "true"
      HF_HUB_OFFLINE: "1"

      OPENAI_API_BASE_URL: "http://llm-proxy:9090/v1"
      OPENAI_API_KEY: "${LLM_PROXY_API_KEY}"

      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: "searxng"
      WEB_SEARCH_RESULT_COUNT: "5"
      WEB_SEARCH_CONCURRENT_REQUESTS: "10"
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../volumes/open-webui-test:/app/backend/data

  llm-proxy:
    build: ./llm-proxy
    image: llm-proxy:test
    container_name: llm-proxy-test
    restart: unless-stopped
    ports:
      - "127.0.0.1:10090:9090"
    environment:
      LLM_PROXY_UPSTREAM: "${LLM_PROXY_UPSTREAM}"
      LLM_PROXY_HOST: "0.0.0.0"
    volumes:
      - ../volumes/llm-proxy-test:/app/requests

  copilot-proxy:
    build: ./copilot-proxy
    image: copilot-proxy:test
    container_name: copilot-proxy-test
    restart: unless-stopped
    ports:
      - "127.0.0.1:10091:10091"
    environment:
      COPILOT_PROXY_HOST: "0.0.0.0"
      COPILOT_PROXY_PORT: "10091"
      COPILOT_PROXY_API_KEY: "${COPILOT_PROXY_API_KEY:-}"
      COPILOT_PROXY_GHE_HOST: "${COPILOT_PROXY_GHE_HOST:-}"
      COPILOT_PROXY_COPILOT_SDK_LOG_LEVEL: "${COPILOT_PROXY_COPILOT_SDK_LOG_LEVEL:-warning}"
      COPILOT_PROXY_LOG_LEVEL: "${COPILOT_PROXY_LOG_LEVEL:-debug}"
      COPILOT_PROXY_LOG_REQUESTS: "${COPILOT_PROXY_LOG_REQUESTS:-true}"
    volumes:
      - copilot-proxy-data-test:/home/node/.copilot
      - ../volumes/copilot-proxy-logs-test:/app/logs/copilot-proxy

  searxng:
    image: searxng/searxng:latest
    container_name: searxng-test
    restart: unless-stopped
    volumes:
      - ../volumes/searxng-test:/etc/searxng:rw

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:latest
    container_name: open-terminal-test
    restart: unless-stopped
    environment:
      OPEN_TERMINAL_API_KEY: "${OPEN_TERMINAL_API_KEY}"
    volumes:
      - ../volumes/open-terminal-test:/home/user

volumes:
  dsh-home-test:
  copilot-proxy-data-test:
