include:
  - path:
      - ./dsh-git/docker-compose.yml
      - ./docker-compose.dsh-git.override.yml

services:
  deepseek-harness:
    build:
      context: .
      additional_contexts:
        dsh_source: "${DSH_SOURCE:-../deepseek-harness}"
        dsh_docker_git_source: "${DSH_DOCKER_GIT_SOURCE:-../.git/modules/deepseek-harness}"

    image: ${DSH_IMAGE:-deepseek-harness:latest}
    container_name: dsh
    
    environment:
      DSH_PUBLIC_WEB_URL: "http://localhost:3080"
      # Provider API keys, sourced from the host .env file. Each name matches
      # the provider's apiKeyEnv entry in settings.seed.yaml (provider name in
      # upper case + _API_KEY). An empty value means the key is not provided.
      LLM_PROXY_API_KEY: "${LLM_PROXY_API_KEY:-}"
      COPILOT_PROXY_API_KEY: "${COPILOT_PROXY_API_KEY:-}"

    ports:
      # deepseek-harness port
      - "127.0.0.1:3080:3080"
      # Ports for agents applications
      - "127.0.0.1:3310-3330:3310-3330"

    volumes:
      - "../volumes/workspaces:/home/node"
      - "dsh-home:/home/node/.dsh"
      # Settings seed for the startup merge; mounted read-only so host edits
      # apply without rebuilding the image.
      - "./settings.seed.yaml:/opt/dsh-seed/settings.seed.yaml:ro"

    networks:
      - default
      - dsh_git

    stdin_open: true
    tty: true
    
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-9999}:8080"
    environment:
      WEBUI_URL: "http://localhost:${OPEN_WEBUI_PORT:-9999}"
      WEBUI_AUTH: "true"
      HF_HUB_OFFLINE: "1"

      OPENAI_API_BASE_URL: "http://llm-proxy:${LLM_PROXY_PORT:-9090}/v1"
      OPENAI_API_KEY: "${LLM_PROXY_API_KEY}"

      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: "searxng"
      WEB_SEARCH_RESULT_COUNT: "5"
      WEB_SEARCH_CONCURRENT_REQUESTS: "10"
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../volumes/open-webui:/app/backend/data

  llm-proxy:
    build: ./llm-proxy
    image: llm-proxy:latest
    container_name: llm-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LLM_PROXY_PORT:-9090}:9090"
    environment:
      LLM_PROXY_UPSTREAM: "${LLM_PROXY_UPSTREAM}"
      LLM_PROXY_HOST: "0.0.0.0"
    volumes:
      - ../volumes/llm-proxy:/app/requests

  copilot-proxy:
    build: ./copilot-proxy
    image: copilot-proxy:latest
    container_name: copilot-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${COPILOT_PROXY_PORT:-9091}:9091"
    environment:
      COPILOT_PROXY_HOST: "0.0.0.0"
      COPILOT_PROXY_PORT: "${COPILOT_PROXY_API_KEY:-9091}"
      COPILOT_PROXY_API_KEY: "${COPILOT_PROXY_API_KEY:-}"
      COPILOT_PROXY_GHE_HOST: "${COPILOT_PROXY_GHE_HOST:-}"
      COPILOT_PROXY_COPILOT_SDK_LOG_LEVEL: "${COPILOT_PROXY_COPILOT_SDK_LOG_LEVEL:-warning}"
      COPILOT_PROXY_LOG_LEVEL: "${COPILOT_PROXY_LOG_LEVEL:-debug}"
      COPILOT_PROXY_LOG_REQUESTS: "${COPILOT_PROXY_LOG_REQUESTS:-true}"
    volumes:
      - copilot-proxy-data:/home/node/.copilot
      - ../volumes/copilot-proxy-logs:/app/logs/copilot-proxy

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    volumes:
      - ../volumes/searxng:/etc/searxng:rw

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:latest
    container_name: open-terminal
    restart: unless-stopped
    environment:
      OPEN_TERMINAL_API_KEY: "${OPEN_TERMINAL_API_KEY}"
    volumes:
      - ../volumes/open-terminal:/home/user

volumes:
  dsh-home:
  copilot-proxy-data:
