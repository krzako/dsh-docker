ui-theme:
  preference: dark

permission:
  defaultPreset: danger-full-access

llm-pi-ai:
  providers:
    llm_proxy:
      displayName: llm_proxy
      apiKeyEnv: LLM_PROXY_API_KEY
      api: openai-completions
      baseURL: http://llm_proxy:10090
      defaultInput: [text, image]
      defaultContextWindow: 131072
      streamIdleTimeoutMs: 600000

      #      retryPolicy:
      #        mode: always
      #        backoff:
      #          initialDelayMs: 5000
      #          maxDelayMs: 120000
      #          jitterRatio: 0.2

      compat:
        thinkingFormat: chat-template
        chatTemplateKwargs:
          enable_thinking:
            $var: thinking.enabled
          preserve_thinking: true
          reasoning_effort:
            $var: thinking.effort
            omitWhenOff: true

      models:
        - id: qwen3.8-27b
          name: qwen3.8-27b
          reasoningEfforts:
            off: "none"
            low: "low"
            medium: "medium"
            xhigh: "xhigh"

    copilot_proxy:
      defaultInput: [text, image]
      apiKeyEnv: COPILOT_PROXY_API_KEY
      api: openai-completions
      baseURL: http://copilot_proxy:10091/v1
      models:
        - id: auto
        - id: claude-opus-4.7
        - id: claude-sonnet-4.6
        - id: claude-opus-4.6
        - id: claude-sonnet-4.5
        - id: claude-opus-4.5
        - id: claude-haiku-4.5
        - id: gpt-5.6-sol
        - id: gpt-5.6-terra
        - id: gpt-5.6-luna
        - id: gpt-5.5
        - id: gpt-5.4
        - id: gpt-5.4-mini
        - id: gpt-5.3-codex
        - id: gpt-5-mini
        - id: gemini-3.5-flash
        - id: gemini-3.1-pro-preview

agent-default-model:
  provider: llm_proxy
  model: qwen3.8-27b

agent-presets:
  default: ptc
