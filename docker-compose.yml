include:
  - path:
      - ./dsh-git/docker-compose.yml
      - ./docker-compose.dsh-git.override.yml

services:
  deepseek-harness:
    build:
      context: .
      additional_contexts:
        dsh_source: "${DSH_SOURCE:-./deepseek-harness}"
        dsh_docker_git_source: "${DSH_DOCKER_GIT_SOURCE:-./.git/modules/deepseek-harness}"

    image: deepseek-harness:latest
    container_name: dsh
    
    environment:
      DSH_PUBLIC_WEB_URL: "http://localhost:3080"

    ports:
      # deepseek-harness port
      - "127.0.0.1:3080:3080"
      # Ports for agents applications
      - "127.0.0.1:3310-3330:3310-3330"

    volumes:
      - "./volumes/workspaces:/home/node"
      - "dsh-home:/home/node/.dsh"

    networks:
      - default
      - dsh_git

    stdin_open: true
    tty: true

volumes:
  dsh-home:
